<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Send Message | Md Mahadi Hasan</title>

<meta name="description" content="Send a message to Md Mahadi Hasan through the official website.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

min-height:100vh;

color:#fff;

background:
linear-gradient(
180deg,
rgba(5,25,19,.60),
rgba(4,15,22,.92)
),
url("https://images.unsplash.com/photo-1497366754035-f200968a6e72?w=1600");

background-size:cover;
background-position:center;
background-attachment:fixed;

padding-bottom:40px;
}

/* TOP BAR */

.topbar{

text-align:center;

padding:14px;

font-size:13px;

letter-spacing:1px;

background:rgba(255,255,255,.08);

border-bottom:1px solid rgba(255,255,255,.15);

backdrop-filter:blur(20px);

-webkit-backdrop-filter:blur(20px);
}

/* CONTAINER */

.container{

width:92%;

max-width:800px;

margin:auto;
}

/* HEADER */

.header{

display:flex;

justify-content:space-between;

align-items:center;

padding:25px 0;
}

.logo{

font-size:24px;

font-weight:800;

letter-spacing:.3px;
}

/* HOME BUTTON */

.home-btn{

text-decoration:none;

color:#fff;

padding:10px 18px;

border-radius:30px;

background:rgba(255,255,255,.10);

border:1px solid rgba(255,255,255,.18);

transition:.3s;
}

.home-btn:visited{

color:#fff;
}

.home-btn:hover{

background:#24c982;

color:#071b14;

transform:translateY(-2px);
}

/* PAGE TITLE */

.page-title{

text-align:center;

margin:25px 0 30px;
}

.page-title h1{

font-size:40px;

font-weight:800;

margin-bottom:10px;
}

.page-title p{

font-size:14px;

opacity:.80;

line-height:1.7;
}

/* MESSAGE CARD */

.message-card{

padding:32px;

border-radius:30px;

background:rgba(255,255,255,.11);

border:1px solid rgba(255,255,255,.18);

backdrop-filter:blur(25px);

-webkit-backdrop-filter:blur(25px);

box-shadow:0 25px 55px rgba(0,0,0,.35);
}

/* ICON */

.message-icon{

width:75px;

height:75px;

display:flex;

align-items:center;

justify-content:center;

margin:0 auto 20px;

border-radius:25px;

font-size:34px;

background:
linear-gradient(
135deg,
#22c77b,
#176b50
);

box-shadow:0 12px 25px rgba(0,0,0,.25);
}

/* FORM */

.form-group{

margin-bottom:18px;
}

.form-group label{

display:block;

font-size:13px;

margin-bottom:7px;

opacity:.85;
}

.form-group input,
.form-group textarea{

width:100%;

padding:15px 16px;

border:none;

outline:none;

color:#fff;

font-size:14px;

border-radius:16px;

background:rgba(255,255,255,.08);

border:1px solid rgba(255,255,255,.15);

transition:.3s;
}

.form-group input::placeholder,
.form-group textarea::placeholder{

color:rgba(255,255,255,.50);
}

.form-group input:focus,
.form-group textarea:focus{

border-color:#69df9a;

background:rgba(255,255,255,.12);

box-shadow:
0 0 0 3px rgba(105,223,154,.10);
}

/* TEXTAREA */

.form-group textarea{

height:180px;

resize:vertical;
}

/* SEND BUTTON */

.send-btn{

width:100%;

padding:16px;

border:none;

border-radius:17px;

color:#fff;

font-size:15px;

font-weight:700;

cursor:pointer;

background:
linear-gradient(
135deg,
#22c77b,
#176b50
);

box-shadow:0 12px 28px rgba(0,0,0,.28);

transition:.3s;
}

.send-btn:hover{

transform:translateY(-3px);

box-shadow:0 16px 35px rgba(0,0,0,.35);
}

.send-btn:active{

transform:translateY(0);
}

/* NOTE */

.note{

text-align:center;

margin-top:17px;

font-size:12px;

opacity:.60;

line-height:1.6;
}

/* BACK LINK */

.back{

display:block;

text-align:center;

margin-top:20px;

color:#fff;

text-decoration:none;

font-size:13px;

opacity:.80;

transition:.3s;
}

.back:hover{

opacity:1;

color:#69df9a;
}

/* FOOTER */

footer{

text-align:center;

padding:40px 20px 10px;

opacity:.8;
}

footer h2{

margin-bottom:7px;
}

footer p{

font-size:13px;
}

/* MOBILE */

@media(max-width:600px){

body{

background-attachment:scroll;
}

.container{

width:92%;
}

.header{

padding:20px 0;
}

.logo{

font-size:20px;
}

.home-btn{

padding:9px 15px;

font-size:13px;
}

.page-title h1{

font-size:31px;
}

.page-title p{

font-size:13px;
}

.message-card{

padding:25px 20px;

border-radius:25px;
}

.message-icon{

width:65px;

height:65px;

font-size:29px;
}

}

/* SMALL MOBILE */

@media(max-width:380px){

.logo{

font-size:18px;
}

.home-btn{

padding:8px 12px;

font-size:12px;
}

.page-title h1{

font-size:27px;
}

.message-card{

padding:22px 16px;
}

}

</style>

</head>


<body>


<!-- TOP BAR -->

<div class="topbar">

✉️ Send a Message • Md Mahadi Hasan

</div>


<!-- MAIN CONTAINER -->

<div class="container">


<!-- HEADER -->

<header class="header">

<div class="logo">

Md Mahadi Hasan

</div>


<a href="index.html" class="home-btn">

🏠 Home

</a>

</header>


<!-- PAGE TITLE -->

<div class="page-title">

<h1>

Send Me a Message

</h1>

<p>

Have something to say? I'd love to hear from you.

</p>

</div>


<!-- MESSAGE CARD -->

<div class="message-card">


<!-- MESSAGE ICON -->

<div class="message-icon">

✉️

</div>


<!-- WEB3FORMS -->

<form
action="https://api.web3forms.com/submit"
method="POST"
>


<!-- WEB3FORMS ACCESS KEY -->

<input
type="hidden"
name="access_key"
value="bbefc9e6-badb-467d-8627-49ea696ce289"
>


<!-- EMAIL SUBJECT -->

<input
type="hidden"
name="subject"
value="New Message From Md Mahadi Hasan Website"
>


<!-- SENDER NAME -->

<input
type="hidden"
name="from_name"
value="Md Mahadi Hasan Website"
>


<!-- AFTER SUBMIT REDIRECT -->

<input
type="hidden"
name="redirect"
value="https://mahaditoday.github.io/the-mahadi-sanctuary/reserve.html"
>


<!-- NAME -->

<div class="form-group">

<label>

Your Name

</label>

<input
type="text"
name="name"
placeholder="Enter your full name"
autocomplete="name"
required
>

</div>


<!-- EMAIL -->

<div class="form-group">

<label>

Your Email

</label>

<input
type="email"
name="email"
placeholder="Enter your email address"
autocomplete="email"
required
>

</div>


<!-- MESSAGE SUBJECT -->

<div class="form-group">

<label>

Subject

</label>

<input
type="text"
name="message_subject"
placeholder="Enter message subject"
required
>

</div>


<!-- MESSAGE -->

<div class="form-group">

<label>

Your Message

</label>

<textarea
name="message"
placeholder="Write your message here..."
required
></textarea>

</div>


<!-- SEND BUTTON -->

<button
type="submit"
class="send-btn"
>

Send Message

<span>→</span>

</button>


</form>


<!-- SECURITY NOTE -->

<p class="note">

🔒 Your message will be sent securely through Web3Forms.

</p>


<!-- BACK TO CONTACT -->

<a
href="contact.html"
class="back"
>

← Back to Contact

</a>


</div>

</div>


<!-- FOOTER -->

<footer>

<h2>

Md Mahadi Hasan

</h2>

<p>

Traveler • Blogger • Explorer

</p>

<p style="margin-top:8px;">

© 2026 All Rights Reserved

</p>

</footer>


</body>

</html>
